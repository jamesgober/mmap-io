name: bench-regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel an in-flight bench run on a branch when a new commit lands;
# benches are expensive and we only ever want the latest verdict.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

# REPS.md section 7: a regression of more than 10% on any documented
# benchmark must be fixed or justified in the CHANGELOG. Shared runners
# are noisy, so a failure here means "look at the numbers", not
# automatically "real regression".
env:
  REGRESSION_LIMIT: "1.10"

jobs:
  bench:
    name: Run benches and check for regressions (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch enough history that we can check out the PR's base
          # commit for a same-machine baseline run.
          fetch-depth: 50

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install critcmp (criterion comparison tool)
        run: |
          if ! command -v critcmp >/dev/null 2>&1; then
            cargo install critcmp --locked
          fi

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            bench-${{ runner.os }}-

      # Run the PR head's benches against a stable baseline name.
      - name: Run benchmarks (HEAD)
        run: |
          cargo bench --all-features --bench mmap_bench -- \
            --save-baseline pr-head

      # On PRs, also bench the merge-base commit on the same runner
      # so the comparison is apples-to-apples (same CPU, same kernel,
      # same noise floor). On pushes to main we skip this step
      # because there is no PR to compare against.
      - name: Bench PR base for same-machine comparison
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          git fetch origin "$BASE" --depth 1 || true
          git checkout "$BASE" -- benches/ src/ Cargo.toml Cargo.lock
          cargo bench --all-features --bench mmap_bench -- \
            --save-baseline pr-base
          # Restore the PR head's tree so subsequent steps see it.
          git checkout HEAD -- benches/ src/ Cargo.toml Cargo.lock

      # Hard gate. `critcmp pr-base pr-head` prints two header lines,
      # then one row per benchmark:
      #
      #   <group/name>  <ratio> <time±err> <thrpt> <unit>  <ratio> <time±err> <thrpt> <unit>
      #
      # with one 4-column block per baseline, in the order given (base,
      # then head). Each ratio is relative to the fastest baseline for
      # that row (the fastest is 1.00), and throughput is "? ?/sec"
      # when a bench sets none. So field 6 is HEAD's ratio, and a value
      # above REGRESSION_LIMIT means HEAD is that much slower than base.
      # A run that parses no rows fails too, so a format change cannot
      # turn the gate into a silent pass.
      - name: Compare HEAD vs base (fails above REGRESSION_LIMIT)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          critcmp pr-base pr-head | tee critcmp.txt
          awk -v limit="$REGRESSION_LIMIT" '
            NR > 2 && NF >= 9 && $2 ~ /^[0-9.]+$/ && $6 ~ /^[0-9.]+$/ {
              rows++
              if ($6 + 0 > limit + 0) {
                printf "::error::%s regressed: HEAD is %.2fx base\n", $1, $6
                bad++
              }
            }
            END {
              if (rows == 0) {
                print "::error::no benchmark rows parsed from critcmp output"
                exit 2
              }
              printf "Compared %d benchmarks, %d over the %sx limit.\n", rows, bad, limit
              exit (bad > 0)
            }
          ' critcmp.txt

      - name: Upload criterion results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion/
          retention-days: 14
