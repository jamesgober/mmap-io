name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Test suite on stable, on every OS, for the default feature set,
  # all features, no features, and each feature on its own. Each
  # feature has platform-specific code, so single-feature rows run on
  # all three OSes too.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        name:
          - default
          - all-features
          - no-default-features
          - advise
          - iterator
          - cow
          - locking
          - atomic
          - watch
          - async
          - bytes
          - hugepages
        include:
          - name: default
            flags: ""
          - name: all-features
            flags: "--all-features"
          - name: no-default-features
            flags: "--no-default-features"
          - name: advise
            flags: "--no-default-features --features advise"
          - name: iterator
            flags: "--no-default-features --features iterator"
          - name: cow
            flags: "--no-default-features --features cow"
          - name: locking
            flags: "--no-default-features --features locking"
          - name: atomic
            flags: "--no-default-features --features atomic"
          - name: watch
            flags: "--no-default-features --features watch"
          - name: async
            flags: "--no-default-features --features async"
          - name: bytes
            flags: "--no-default-features --features bytes"
          - name: hugepages
            flags: "--no-default-features --features hugepages"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test ${{ matrix.flags }}

  # MSRV: the library must build on Rust 1.75. Only the library is
  # built: current releases of the dev-dependencies (proptest, and
  # half through criterion) need a newer compiler, so the test suite
  # runs on stable above.
  msrv:
    name: MSRV 1.75 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75

      - name: Build library (default features)
        run: cargo build --lib --locked

      - name: Build library (all features)
        run: cargo build --lib --all-features --locked

  # Benches must keep compiling; running them is bench-regression.yml's
  # job (on one machine, against a same-runner baseline).
  bench-build:
    name: Bench build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build benches (default features)
        run: cargo bench --no-run

      - name: Build benches (all features)
        run: cargo bench --no-run --all-features

  # Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy analysis
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Rustdoc (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
