name: semver-checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Run only one semver-check per PR branch at a time.
concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver-checks:
    name: cargo-semver-checks (vs. published)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt release binary, latest version on every run, so the
      # lint set tracks new cargo-semver-checks releases.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Run semver-checks against the latest published release
        # `check-release` walks the public API and compares it to the
        # version on crates.io. Since 1.0 this is a hard gate: a
        # breaking change without a major-version bump fails the PR.
        run: cargo semver-checks check-release --all-features
