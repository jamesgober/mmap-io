name: audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily run at 04:17 UTC so RUSTSEC advisories surface as
    # standalone red runs in the maintainer's morning even when no
    # PR / push is happening.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Cancel in-flight audit runs on a branch when a new commit lands; we
# only ever want the latest audit verdict per branch tip.
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo-audit (RUSTSEC advisories + yanks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt release binary, latest version on every run. The old
      # "-v1" binary cache never expired, so the advisory scanner
      # itself was never updated.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        # `--deny warnings` makes yanked-crate warnings (the 0.9.9
        # slab incident) fail CI at PR time instead of at publish
        # time. RUSTSEC advisories fail by default.
        run: cargo audit --deny warnings

  cargo-deny-licenses:
    name: cargo-deny (license + dep policy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Non-blocking for now: surfaces info but does not gate merges.
    # Promote to required-check after the maintainer has triaged the
    # initial run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny check
        run: cargo deny check
